<script type="module" data-module="@gilansalehi/expertise">
  import { action } from 'data-wrapper';
  import initPage from 'site/views/page.js';

  const PANELS = {
    capabilities: {
      title: 'Capabilities',
      tabId: 'capabilities-tab',
    },
    skills: {
      title: 'Skills',
      tabId: 'skills-tab',
    },
  };

  export default context => {
    let activePanel = 'capabilities';

    initPage(context);

    const selectPanel = panel => {
      activePanel = panel;
    };

    return {
      activeTitle: () => PANELS[activePanel].title,
      capabilitiesSelected: () => String(activePanel === 'capabilities'),
      capabilitiesTabIndex: () => activePanel === 'capabilities' ? 0 : -1,
      capabilitiesTabClass: () => activePanel === 'capabilities' ? 'is-active' : '',
      capabilitiesHidden: () => activePanel !== 'capabilities',
      skillsSelected: () => String(activePanel === 'skills'),
      skillsTabIndex: () => activePanel === 'skills' ? 0 : -1,
      skillsTabClass: () => activePanel === 'skills' ? 'is-active' : '',
      skillsHidden: () => activePanel !== 'skills',
      showCapabilities: action(() => selectPanel('capabilities')),
      showSkills: action(() => selectPanel('skills')),
      navigateTabs: action(event => {
        const keys = 'ArrowLeft ArrowRight Home End'.split(' ');
        if (!keys.includes(event.key)) return;

        event.preventDefault();
        const showSkills = event.key === 'ArrowRight' || event.key === 'End';
        const nextPanel = showSkills ? 'skills' : 'capabilities';

        selectPanel(nextPanel);
        event.target.closest('[role="tablist"]')
          ?.querySelector(`#${PANELS[nextPanel].tabId}`)
          ?.focus();
      }),
    };
  };
</script>

<section class="portfolio__expertise" aria-labelledby="expertise-title">
  <div class="portfolio__inner">
    <header class="portfolio__section-header" data-scroll-animation="animate__fadeInUp">
      <p class="portfolio__eyebrow">What I bring</p>
      <div class="expertise__heading">
        <h1 id="expertise-title" $text="activeTitle"></h1>
        <div class="expertise__tabs" role="tablist" aria-label="Expertise view" @keydown="navigateTabs">
          <button
            id="capabilities-tab"
            type="button"
            role="tab"
            aria-controls="capabilities-panel"
            $aria-selected="capabilitiesSelected"
            $tabindex="capabilitiesTabIndex"
            $class="capabilitiesTabClass"
            @click="showCapabilities"
          >Capabilities</button>
          <button
            id="skills-tab"
            type="button"
            role="tab"
            aria-controls="skills-panel"
            $aria-selected="skillsSelected"
            $tabindex="skillsTabIndex"
            $class="skillsTabClass"
            @click="showSkills"
          >Skills</button>
        </div>
      </div>
    </header>

    <div class="expertise__panels">
      <div
        id="capabilities-panel"
        class="expertise__panel"
        role="tabpanel"
        aria-labelledby="capabilities-tab"
        $hidden="capabilitiesHidden"
      >
        <data-wrapper src="/views/portfolio/capabilities.html"></data-wrapper>
      </div>
      <div
        id="skills-panel"
        class="expertise__panel"
        role="tabpanel"
        aria-labelledby="skills-tab"
        $hidden="skillsHidden"
      >
        <data-wrapper src="/views/portfolio/skills.html"></data-wrapper>
      </div>
    </div>
  </div>
</section>
