<script type="module" data-module="@gilansalehi/skills">
  import { SKILLS } from 'site/modules/evidenceCatalog.js';
  import {
    evidenceRows,
    previewEvidence,
    restoreEvidence,
    toggleEvidence,
  } from 'site/modules/projectEvidence.js';
  import initPage from 'site/views/page.js';

  export default context => {
    initPage(context);

    return {
      itemView: () => evidenceRows(SKILLS, 'skill'),
      previewEvidence,
      restoreEvidence,
      toggleEvidence,
    };
  };
</script>

<ul class="skills__list">
  <template *list="itemView?key=id">
    <li
      $data-skill="./id"
      $class="./itemClass"
      @mouseenter="previewEvidence"
      @mouseleave="restoreEvidence"
      data-scroll-animation="animate__fadeInUp"
    >
      <button
        type="button"
        class="skills__pip"
        $title="./title"
        $aria-label="./buttonLabel"
        $aria-pressed="./pressed"
        $disabled="./disabled"
        @focus="previewEvidence"
        @blur="restoreEvidence"
        @click="toggleEvidence"
      >
        <span $text="./code" aria-hidden="true"></span>
      </button>
      <strong $text="./title"></strong>
    </li>
  </template>
</ul>
