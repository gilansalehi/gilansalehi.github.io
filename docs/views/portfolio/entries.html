<script type="module" data-module="@gilansalehi/portfolio-entries">
  import { CAPABILITIES, SKILLS } from 'site/modules/evidenceCatalog.js';
  import {
    previewEvidence,
    projectEvidenceClass,
    projectEvidenceRows,
    restoreEvidence,
    toggleEvidence,
  } from 'site/modules/projectEvidence.js';
  import { technologyRows } from 'site/modules/technologyCatalog.js';
  import initPage from 'site/views/page.js';

  const read = value => typeof value === 'function' ? value() : value;

  export default context => {
    const { props } = context;

    initPage(context);

    return {
      entries: () => {
        const source = read(props.entries);

        return (Array.isArray(source) ? source : []).map(entry => {
          const hasMediaLink = Boolean(entry.href);

          return {
            ariaLabel: `Visit ${entry.title}`,
            mediaClass: '',
            ...entry,
            capabilities: projectEvidenceRows(CAPABILITIES, 'capability', entry.id),
            entryClass: projectEvidenceClass(entry.id, {
              capability: CAPABILITIES,
              skill: SKILLS,
            }),
            hasMediaLink,
            hasStaticMedia: !hasMediaLink,
            skills: projectEvidenceRows(SKILLS, 'skill', entry.id),
            technologies: technologyRows(entry.technologies ?? []),
          };
        });
      },
      previewEvidence,
      restoreEvidence,
      toggleEvidence,
    };
  };
</script>

<div class="portfolio__list">
  <template *list="entries?key=id">
    <section
      class="portfolio-entry"
      $class="./entryClass"
      $data-project="./id"
      data-scroll-animation="animate__fadeInUp"
    >
      <template *if="./hasMediaLink">
        <a
          class="portfolio-entry__media"
          $class="./mediaClass"
          $href="./href"
          $aria-label="./ariaLabel"
        >
          <img
            $src="./image/src"
            $alt="./image/alt"
            $width="./image/width"
            $height="./image/height"
            loading="lazy"
            decoding="async"
          >
        </a>
      </template>
      <template *if="./hasStaticMedia">
        <figure class="portfolio-entry__media portfolio-entry__media--static" $class="./mediaClass">
          <img
            $src="./image/src"
            $alt="./image/alt"
            $width="./image/width"
            $height="./image/height"
            loading="lazy"
            decoding="async"
          >
        </figure>
      </template>
      <div class="portfolio-entry__body">
        <p class="portfolio-entry__type" $text="./type"></p>
        <h3 $text="./title"></h3>
        <p $text="./description"></p>
        <template *if="./technologies?count">
          <ul class="portfolio-entry__tools" aria-label="Technologies">
            <template *list="./technologies?key=code">
              <li $text="./name"></li>
            </template>
          </ul>
        </template>
        <template *if="./capabilities?count">
          <div class="portfolio-entry__evidence portfolio-entry__evidence--capability">
            <span class="portfolio-entry__evidence-label">Capabilities</span>
            <ul aria-label="Capabilities demonstrated by this project">
              <template *list="./capabilities?key=id">
                <li>
                  <button
                    type="button"
                    $class="./pipClass"
                    $title="./title"
                    $aria-label="./buttonLabel"
                    $aria-pressed="./pressed"
                    @mouseenter="previewEvidence"
                    @mouseleave="restoreEvidence"
                    @focus="previewEvidence"
                    @blur="restoreEvidence"
                    @click="toggleEvidence"
                  >
                    <span $text="./code" aria-hidden="true"></span>
                  </button>
                </li>
              </template>
            </ul>
          </div>
        </template>
        <template *if="./skills?count">
          <div class="portfolio-entry__evidence portfolio-entry__evidence--skill">
            <span class="portfolio-entry__evidence-label">Skills</span>
            <ul aria-label="Skills demonstrated by this project">
              <template *list="./skills?key=id">
                <li>
                  <button
                    type="button"
                    $class="./pipClass"
                    $title="./title"
                    $aria-label="./buttonLabel"
                    $aria-pressed="./pressed"
                    @mouseenter="previewEvidence"
                    @mouseleave="restoreEvidence"
                    @focus="previewEvidence"
                    @blur="restoreEvidence"
                    @click="toggleEvidence"
                  >
                    <span $text="./code" aria-hidden="true"></span>
                  </button>
                </li>
              </template>
            </ul>
          </div>
        </template>
        <template *if="./links?count">
          <div class="portfolio-entry__links">
            <template *list="./links?key=href">
              <a $href="./href" $text="./label"></a>
            </template>
          </div>
        </template>
      </div>
    </section>
  </template>
</div>
