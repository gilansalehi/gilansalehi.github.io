<script type="module" data-module="@gilansalehi/capabilities">
  import { CAPABILITIES } from 'site/modules/evidenceCatalog.js';
  import {
    evidenceRows,
    previewEvidence,
    restoreEvidence,
    toggleEvidence,
  } from 'site/modules/projectEvidence.js';
  import initPage from 'site/views/page.js';

  export default context => {
    initPage(context);

    return {
      itemView: () => evidenceRows(CAPABILITIES, 'capability'),
      previewEvidence,
      restoreEvidence,
      toggleEvidence,
    };
  };
</script>

<ol class="capabilities__list">
  <template *list="itemView?key=id">
    <li
      $data-capability="./id"
      $class="./itemClass"
      @mouseenter="previewEvidence"
      @mouseleave="restoreEvidence"
      data-scroll-animation="animate__fadeInUp"
    >
      <button
        type="button"
        class="capabilities__pip"
        $title="./title"
        $aria-label="./buttonLabel"
        $aria-pressed="./pressed"
        $disabled="./disabled"
        @focus="previewEvidence"
        @blur="restoreEvidence"
        @click="toggleEvidence"
      >
        <span $text="./code" aria-hidden="true"></span>
      </button>
      <div>
        <h2 $text="./title" class="titlecase"></h2>
        <p $text="./description"></p>
      </div>
    </li>
  </template>
</ol>
