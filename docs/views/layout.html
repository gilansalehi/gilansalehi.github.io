<script type="module" data-module="@gilansalehi/layout">
  import { action } from 'data-wrapper';

  const pages = Object.freeze([
    { name: 'home', path: '/' },
    { name: 'about', path: '/about/' },
    { name: 'resume', path: '/resume/' },
    { name: 'portfolio', path: '/portfolio/' },
    { name: 'notes', path: '/notes/' },
    { name: 'contact', path: '/contact/' },
    { name: 'settings', path: '/settings/' },
  ]);

  const parsedModified = new Date(document.lastModified);
  const lastModified = Number.isNaN(parsedModified.valueOf()) ? null : parsedModified;

  export default ({ wrapper, cleanup }) => {
    const currentPage = wrapper.dataset.page || 'home';
    const currentView = wrapper.dataset.view || '/views/home.html';
    let menuOpen = false;

    const updateBody = () => {
      document.body.dataset.currentPage = currentPage;
    };

    const closeMenu = action(() => {
      menuOpen = false;
    });

    const handleKeyUp = event => {
      if (event.key === 'Escape' && menuOpen) {
        closeMenu();
      }
    };

    document.body.addEventListener('keyup', handleKeyUp);
    cleanup(() => {
      document.body.removeEventListener('keyup', handleKeyUp);
      delete document.body.dataset.currentPage;
    });

    updateBody();

    return {
      pages,
      currentView,

      get headerStateClass() {
        return `${currentPage}${menuOpen ? ' open' : ''}`;
      },

      toggleMenu: action(() => {
        menuOpen = !menuOpen;
      }),

      copyright: `\u00a9 ${new Date().getFullYear()} Gilan Salehi`,
      lastUpdatedISO: lastModified ? lastModified.toISOString().slice(0, 10) : '',
      lastUpdatedLabel: lastModified
        ? lastModified.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })
        : 'recently',
    };
  };
</script>

<!-- NAVBAR -->
<header
  class="nav"
  $class="headerStateClass"
  data-ref="menu:wrapper"
>
  <button
    class="nav__icon hover--shine"
    @click="toggleMenu"
    tabindex="0"
    aria-label="Toggle navigation"
  >
    <hr>
    <hr>
    <hr>
  </button>
  <nav class="nav__menu" data-ref="nav:menu">
    <ul class="nav__menu__list">
      <template *list="pages">
        <li><a $href="./path" class="animate hover--underline" $text="./name"></a></li>
      </template>
    </ul>
  </nav>
  <span class="nav__close" @click="toggleMenu"></span>
</header>

<main class="page-outlet">
  <template *src="currentView"></template>
</main>

<!-- FOOTER -->
<footer class="footer">
  <nav class="footer__nav" aria-label="Footer">
    <ul class="footer__list">
      <template *list="pages">
        <li><a class="footer__link titlecase hover--underline" $href="./path" $text="./name"></a></li>
      </template>
    </ul>
  </nav>

  <div class="footer__meta">
    <p class="footer__copyright" $text="copyright"></p>
    <p class="footer__updated">
      Last updated
      <time $datetime="lastUpdatedISO" $text="lastUpdatedLabel"></time>
    </p>
  </div>
</footer>
