<script type="module" data-module="@gilansalehi/site">
  const routes = {
    home:      { label: 'Home',       view: './views/home.html' },
    // about:     { label: 'About',      view: './views/about.html' },
    resume:    { label: 'Resume',     view: './resume.html' },
    portfolio: { label: 'Portfolio',  view: './portfolio.html' },
    skills:    { label: 'Skills',     view: './skills.html' },
    contact:   { label: 'Contact',    view: './contact.html' },
    playground:{ label: 'Playground', view: './todos.html' },
  };

  const defaults = {
    accent: '#77eeee',
    secondary: '#800080',
    surface: '#333333',
    position: 'top-left',
  };

  const readPage = () => {
    const candidate = window.location.hash.slice(1).toLowerCase();
    return routes[candidate] ? candidate : 'home';
  };

  const readPreferences = () => {
    try {
      return { ...defaults, ...JSON.parse(localStorage.getItem('gilan:preferences') || '{}') };
    } catch {
      return { ...defaults };
    }
  };

  export default ({ wrapper, cleanup }) => {
    let currentPage = readPage();
    let menuOpen = false;
    let preferences = readPreferences();

    const applyDocumentState = () => {
      wrapper.dataset.page = currentPage;
      document.body.dataset.currentPage = currentPage;
      document.title = `${routes[currentPage].label} | Gilan Salehi`;
    };

    const applyPreferences = () => {
      document.body.style.setProperty('--theme-color-1', preferences.accent);
      document.body.style.setProperty('--theme-color-2', preferences.secondary);
      document.body.style.setProperty('--theme-color-3', preferences.surface);
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content', preferences.accent);

      try {
        localStorage.setItem('gilan:preferences', JSON.stringify(preferences));
      } catch {}
    };

    const selectPage = (page, updateHistory = false) => {
      currentPage = routes[page] ? page : 'home';
      menuOpen = false;
      applyDocumentState();

      if (updateHistory && window.location.hash !== `#${currentPage}`) {
        history.pushState(null, '', `#${currentPage}`);
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    const onHashChange = () => {
      wrapper.dispatchEvent(new CustomEvent('routechange', { bubbles: true }));
    };

    const onKeyDown = (event) => {
      if (event.key === 'Escape' && menuOpen) {
        wrapper.dispatchEvent(new CustomEvent('closemenu', { bubbles: true }));
      }
    };

    window.addEventListener('hashchange', onHashChange);
    window.addEventListener('keydown', onKeyDown);
    cleanup(() => window.removeEventListener('hashchange', onHashChange));
    cleanup(() => window.removeEventListener('keydown', onKeyDown));

    applyDocumentState();
    applyPreferences();

    return {
      get currentView() {
        return routes[currentPage].view;
      },

      get menuStateClass() {
        return `nav--${preferences.position}${menuOpen ? ' open' : ''}`;
      },

      get menuExpanded() {
        return String(menuOpen);
      },

      get menuLabel() {
        return menuOpen ? 'Close navigation' : 'Open navigation';
      },

      get navItems() {
        return Object.entries(routes).map(([id, route]) => ({
          id,
          label: route.label,
          href: `#${id}`,
          currentClass: id === currentPage ? 'is-current' : '',
        }));
      },

      get position() {
        return preferences.position;
      },

      get themeOptions() {
        return [
          { id: 'accent', label: 'Accent color', value: preferences.accent },
          { id: 'secondary', label: 'Secondary color', value: preferences.secondary },
          { id: 'surface', label: 'Surface color', value: preferences.surface },
        ];
      },

      toggleMenu() {
        menuOpen = !menuOpen;
      },

      closeMenu() {
        menuOpen = false;
      },

      navigate(event) {
        selectPage(event.detail.item.id, true);
      },

      syncRoute() {
        selectPage(readPage());
      },

      setPosition(event) {
        preferences = { ...preferences, position: event.detail.originalEvent.target.value };
        applyPreferences();
      },

      setThemeColor(event) {
        const { id } = event.detail.item;
        const value = event.detail.originalEvent.target.value;
        preferences = { ...preferences, [id]: value };
        applyPreferences();
      },
    };
  };
</script>

<header class="nav" $class="menuStateClass" @closemenu="closeMenu">
  <button
    class="nav__icon"
    type="button"
    $aria-label="menuLabel"
    $aria-expanded="menuExpanded"
    @click="toggleMenu"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>

  <nav class="nav__menu" aria-label="Primary navigation">
    <ul class="nav__menu__list">
      <template *list="navItems?key=id">
        <li>
          <a
            class="animate hover--underline"
            $class="./currentClass"
            $href="./href"
            $text="./label"
            @click="navigate?prevent"
          ></a>
        </li>
      </template>

      <li class="nav__preferences">
        <details>
          <summary class="animate hover--underline">Preferences</summary>

          <label for="menu-position">Menu position</label>
          <select id="menu-position" $value="position" @change="setPosition">
            <option value="top-left">Top left</option>
            <option value="top-right">Top right</option>
            <option value="bottom-left">Bottom left</option>
            <option value="bottom-right">Bottom right</option>
          </select>

          <fieldset class="theme-color-setter-options">
            <legend>Theme colors</legend>
            <template *list="themeOptions?key=id">
              <label class="theme-swatch" $title="./label">
                <span $text="./label"></span>
                <input
                  type="color"
                  $aria-label="./label"
                  $value="./value"
                  @input="setThemeColor"
                >
              </label>
            </template>
          </fieldset>
        </details>
      </li>
    </ul>
  </nav>

  <button class="nav__close" type="button" aria-label="Close navigation" @click="closeMenu"></button>
</header>

<main class="page-outlet" aria-live="polite">
  <template *src="currentView">
    <section class="page-loading" aria-label="Loading page"></section>
  </template>
</main>
