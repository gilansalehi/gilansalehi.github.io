<script type="module" data-module="@gilansalehi/notes">
  import { action } from 'data-wrapper';

  const noteRoutes = Object.freeze({
    csbhi: '/views/notes/csbhi.html',
  });

  const noteFromLocation = () => {
    const note = new URL(window.location.href).searchParams.get('note');
    return note && Object.hasOwn(noteRoutes, note) ? note : '';
  };

  export default ({ wrapper, cleanup }) => {
    let currentNote = noteFromLocation();

    const setCurrentNote = action(note => {
      currentNote = note;
    });

    const syncRoute = () => {
      setCurrentNote(noteFromLocation());
      window.scrollTo({ top: 0 });
    };

    const navigate = event => {
      const link = event.target.closest('[data-note]');
      if (!link || !wrapper.contains(link)) return;

      const nextNote = link.dataset.note;
      if (nextNote && !Object.hasOwn(noteRoutes, nextNote)) return;

      event.preventDefault();
      window.history.pushState({}, '', link.href);
      setCurrentNote(nextNote);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    wrapper.addEventListener('click', navigate);
    window.addEventListener('popstate', syncRoute);
    cleanup(() => {
      wrapper.removeEventListener('click', navigate);
      window.removeEventListener('popstate', syncRoute);
    });

    return {
      get currentNoteView() {
        return currentNote ? noteRoutes[currentNote] : '/views/notes/index.html';
      },
    };
  };
</script>

<article id="notes" class="field-notes">
  <template *src="currentNoteView"></template>
</article>
