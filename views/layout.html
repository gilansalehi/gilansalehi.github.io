<script type="module" data-module="@gilansalehi/layout">
  import { action } from 'data-wrapper';

  const routes = Object.freeze({
    home: '/views/home.html',
    about: '/views/about.html',
    resume: '/resume.html',
    portfolio: '/portfolio.html',
    skills: '/skills.html',
    contact: '/contact.html',
  });

  const pageFromLocation = () => {
    const page = new URL(window.location.href).searchParams.get('page') || 'home';
    return routes[page] ? page : 'home';
  };

  const sourceEvent = event => event.detail?.originalEvent || event;

  export default ({ wrapper, cleanup }) => {
    let currentPage = pageFromLocation();
    let menuOpen = false;

    const updateBody = () => {
      document.body.dataset.currentPage = currentPage;
    };

    const dispatchToHeader = name => {
      wrapper.querySelector('header')?.dispatchEvent(new CustomEvent(name, { bubbles: true }));
    };

    const handlePopState = () => dispatchToHeader('routechange');
    const handleKeyUp = event => {
      if (event.key === 'Escape' && menuOpen) {
        dispatchToHeader('closemenu');
      }
    };

    window.addEventListener('popstate', handlePopState);
    document.body.addEventListener('keyup', handleKeyUp);
    cleanup(() => {
      window.removeEventListener('popstate', handlePopState);
      document.body.removeEventListener('keyup', handleKeyUp);
      delete document.body.dataset.currentPage;
    });

    updateBody();

    return {
      get currentView() {
        return routes[currentPage];
      },

      get headerStateClass() {
        return `${currentPage}${menuOpen ? ' open' : ''}`;
      },

      navigate: action(event => {
        const link = event.target.closest('[data-page]');
        const nextPage = link?.dataset.page;

        if (!routes[nextPage] || nextPage === currentPage) {
          menuOpen = false;
          return;
        }

        window.history.pushState({}, '', link.href);
        currentPage = nextPage;
        menuOpen = false;
        updateBody();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }),

      syncRoute: action(() => {
        currentPage = pageFromLocation();
        menuOpen = false;
        updateBody();
        window.scrollTo({ top: 0 });
      }),

      toggleMenu: action(() => {
        menuOpen = !menuOpen;
      }),

      closeMenu: action(() => {
        menuOpen = false;
      }),

      setThemeColor1(event) {
        const value = sourceEvent(event).target.value;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', value);
        document.body.style.setProperty('--theme-color-1', value);
      },

      setThemeColor2(event) {
        document.body.style.setProperty('--theme-color-2', sourceEvent(event).target.value);
      },

      setThemeColor3(event) {
        document.body.style.setProperty('--theme-color-3', sourceEvent(event).target.value);
      },

      setMenuPosition(event) {
        const [vertical, horizontal] = sourceEvent(event).target.value.toLowerCase().split(' ');
        const icon = wrapper.querySelector('.nav__icon');
        const menu = wrapper.querySelector('.nav__menu');
        const menuList = wrapper.querySelector('.nav__menu__list');

        icon.style.cssText = `${vertical}: 0; ${horizontal}: 0;`;
        menu.style.cssText = `${vertical}: 0; ${horizontal}: 0;`;
        menuList.style.cssText = `
          justify-content: ${vertical === 'top' ? 'flex-start' : 'flex-end'};
          text-align: ${horizontal};
        `;
      },
    };
  };
</script>

<!-- NAVBAR -->
<header
  class="nav"
  $class="headerStateClass"
  @routechange="syncRoute"
  @closemenu="closeMenu"
  data-ref="menu:wrapper"
>
  <button
    class="nav__icon hover--shine"
    @click="toggleMenu"
    style="top: 0; left: 0;"
    tabindex="0"
    aria-label="Toggle navigation"
  >
    <hr>
    <hr>
    <hr>
  </button>
  <nav class="nav__menu" data-ref="nav:menu">
    <ul class="nav__menu__list">
      <li><a href="?page=home" data-page="home" @click="navigate?prevent" class="nav-first animate hover--underline">Home</a></li>
      <li><a href="?page=about" data-page="about" @click="navigate?prevent" class="animate hover--underline">About</a></li>
      <li><a href="?page=resume" data-page="resume" @click="navigate?prevent" class="animate hover--underline">Resume</a></li>
      <li><a href="?page=portfolio" data-page="portfolio" @click="navigate?prevent" class="animate hover--underline">Portfolio</a></li>
      <li><a href="?page=skills" data-page="skills" @click="navigate?prevent" class="animate hover--underline">Skills</a></li>
      <li><a href="?page=contact" data-page="contact" @click="navigate?prevent" class="animate hover--underline">Contact</a></li>
      <li>
        <details>
          <summary class="animate hover--underline">Preferences</summary>
          <div class="nav__details__contents">
            <label>Menu Position
              <select data-ref="nav:pos" @change="setMenuPosition">
                <option selected>Top Left</option>
                <option>Top Right</option>
                <option>Bottom Left</option>
                <option>Bottom Right</option>
              </select>
            </label>
            <label>Theme Color</label>
            <div class="theme-color-setter-options">
              <input type="color" value="#FFFFFF" default="#FFFFFF" data-ref="colorPicker1" @change="setThemeColor1">
              <input type="color" value="#82effb" default="#82effb" data-ref="colorPicker2" @change="setThemeColor2">
              <input type="color" value="#9a6464" default="#9a6464" data-ref="colorPicker3" @change="setThemeColor3">
            </div>
          </div>
        </details>
      </li>
    </ul>
  </nav>
  <span class="nav__close" @click="toggleMenu"></span>
</header>

<main class="page-outlet">
  <template *src="currentView"></template>
</main>
